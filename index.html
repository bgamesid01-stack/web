<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Masuk &amp; Daftar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <div class="bg-orb orb-1" aria-hidden="true"></div>
  <div class="bg-orb orb-2" aria-hidden="true"></div>

  <main class="app-wrapper">
    <section id="auth-shell" class="auth-shell">
      <!-- PANEL VISUAL SAKURA: Kiri di Desktop, Header Atas di HP -->
      <aside class="brand-panel">
        <div class="petals" aria-hidden="true">
          <span></span><span></span><span></span>
          <span></span><span></span><span></span>
        </div>

        <div class="brand-badge">
          <div class="brand-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 2c1.4 2.6 1.9 5.1.8 7.3 2.3-.9 4.9-.4 7.2 1.2-2.2 1.6-4.7 2.2-7.1 1.4 1.3 2.1 1.1 4.7-.4 7.1-1.5-2.4-1.7-5-.4-7.1-2.4.8-4.9.2-7.1-1.4 2.3-1.6 4.9-2.1 7.2-1.2-1.1-2.2-.6-4.7.8-7.3z"/>
            </svg>
          </div>
          <span class="brand-name">SakuraPortal</span>
        </div>

        <!-- Ilustrasi Bunga Sakura Dekoratif -->
        <div class="sakura-art" aria-hidden="true">
          <svg viewBox="0 0 200 200" fill="none">
            <circle cx="100" cy="100" r="76" stroke="rgba(255,255,255,0.14)" stroke-width="1" stroke-dasharray="4 6"/>
            <circle cx="100" cy="100" r="52" stroke="rgba(251,207,232,0.22)" stroke-width="1"/>
            <path d="M100 34C110 54 113 73 105 90C122 83 141 87 159 99C141 111 122 115 105 108C115 124 113 144 100 164C87 144 85 124 95 108C78 115 59 111 41 99C59 87 78 83 95 90C87 73 90 54 100 34Z" fill="url(#sakuraGrad)" opacity="0.9"/>
            <circle cx="100" cy="99" r="9" fill="#fff1f2"/>
            <defs>
              <linearGradient id="sakuraGrad" x1="41" y1="34" x2="159" y2="164" gradientUnits="userSpaceOnUse">
                <stop stop-color="#fbcfe8"/>
                <stop offset="1" stop-color="#f472b6"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
      </aside>

      <!-- PANEL FORM: Kanan di Desktop, Bottom Sheet di HP -->
      <div class="form-panel">
        <div class="sheet-handle" aria-hidden="true"></div>

        <div class="form-header">
          <h1 id="form-title">Masuk</h1>
        </div>

        <div id="tabs-container" class="tabs" role="tablist">
          <div class="tab-glider" aria-hidden="true"></div>
          <button type="button" id="tab-login" class="tab-btn active" role="tab" aria-selected="true">Masuk</button>
          <button type="button" id="tab-register" class="tab-btn" role="tab" aria-selected="false">Daftar</button>
        </div>

        <div id="alert-box" class="alert hidden" role="alert"></div>

        <!-- FORM MASUK -->
        <form id="login-form" class="auth-form">
          <div class="form-group">
            <label for="login-email">Email</label>
            <div class="input-box">
              <span class="input-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect width="20" height="16" x="2" y="4" rx="2"/>
                  <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
                </svg>
              </span>
              <input type="email" id="login-email" placeholder="nama@email.com" required autocomplete="email" />
            </div>
          </div>

          <div class="form-group">
            <label for="login-password">Kata Sandi</label>
            <div class="input-box">
              <span class="input-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
              </span>
              <input type="password" id="login-password" placeholder="••••••••" required autocomplete="current-password" />
              <button type="button" class="toggle-pw" data-target="login-password" aria-label="Lihat sandi">
                <svg class="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
                <svg class="eye-closed hidden" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/>
                  <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/>
                  <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/>
                  <line x1="2" x2="22" y1="2" y2="22"/>
                </svg>
              </button>
            </div>
          </div>

          <button type="submit" id="btn-login" class="btn-primary">
            <span class="btn-text">Masuk</span>
            <span class="spinner hidden" aria-hidden="true"></span>
          </button>
        </form>

        <!-- FORM DAFTAR -->
        <form id="register-form" class="auth-form hidden">
          <div class="form-group">
            <label for="reg-name">Nama</label>
            <div class="input-box">
              <span class="input-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
                  <circle cx="12" cy="7" r="4"/>
                </svg>
              </span>
              <input type="text" id="reg-name" placeholder="Nama lengkap" required autocomplete="name" />
            </div>
          </div>

          <div class="form-group">
            <label for="reg-email">Email</label>
            <div class="input-box">
              <span class="input-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect width="20" height="16" x="2" y="4" rx="2"/>
                  <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
                </svg>
              </span>
              <input type="email" id="reg-email" placeholder="nama@email.com" required autocomplete="email" />
            </div>
          </div>

          <div class="form-group">
            <label for="reg-password">Kata Sandi</label>
            <div class="input-box">
              <span class="input-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
              </span>
              <input type="password" id="reg-password" placeholder="Min. 6 karakter" minlength="6" required autocomplete="new-password" />
              <button type="button" class="toggle-pw" data-target="reg-password" aria-label="Lihat sandi">
                <svg class="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
                <svg class="eye-closed hidden" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/>
                  <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/>
                  <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/>
                  <line x1="2" x2="22" y1="2" y2="22"/>
                </svg>
              </button>
            </div>
            <div class="strength-bars" id="strength-meter" aria-hidden="true">
              <span class="s-bar"></span>
              <span class="s-bar"></span>
              <span class="s-bar"></span>
            </div>
          </div>

          <div class="form-group">
            <label for="reg-confirm">Ulangi Kata Sandi</label>
            <div class="input-box">
              <span class="input-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                  <path d="m9 12 2 2 4-4"/>
                </svg>
              </span>
              <input type="password" id="reg-confirm" placeholder="••••••••" minlength="6" required autocomplete="new-password" />
            </div>
          </div>

          <button type="submit" id="btn-register" class="btn-primary">
            <span class="btn-text">Daftar</span>
            <span class="spinner hidden" aria-hidden="true"></span>
          </button>
        </form>
      </div>
    </section>
  </main>

  <script src="assets/js/script.js"></script>
</body>
</html>
