<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Masuk — SakuraPortal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <main class="app-wrapper">
    <section id="auth-shell" class="auth-shell">
      <!-- PANEL BRANDING: Kiri di Desktop, Header Ringkas di HP -->
      <aside class="brand-panel">
        <div class="brand-grid" aria-hidden="true"></div>

        <div class="brand-top">
          <div class="brand-badge">
            <div class="brand-mark" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 2.5c1.2 2.4 1.6 4.7.7 6.8 2.1-.8 4.5-.4 6.6 1.1-2 1.5-4.3 2-6.5 1.3 1.2 1.9 1 4.3-.4 6.5-1.4-2.2-1.6-4.6-.4-6.5-2.2.7-4.5.2-6.5-1.3 2.1-1.5 4.5-1.9 6.6-1.1-.9-2.1-.5-4.4.7-6.8z"/>
              </svg>
            </div>
            <span class="brand-name">SakuraPortal</span>
          </div>

          <span class="env-badge">CLOUD</span>
        </div>

        <!-- Emblem Geometris Sakura Minimalis (Khusus Desktop) -->
        <div class="mon-crest" aria-hidden="true">
          <svg viewBox="0 0 220 220" fill="none">
            <circle cx="110" cy="110" r="96" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
            <circle cx="110" cy="110" r="68" stroke="rgba(255,255,255,0.11)" stroke-width="1" stroke-dasharray="3 5"/>
            <circle cx="110" cy="110" r="40" stroke="rgba(244,63,94,0.35)" stroke-width="1"/>
            <path d="M110 52C118 69 120 85 114 99C128 93 144 96 159 106C144 116 128 119 114 113C122 126 120 143 110 160C100 143 98 126 106 113C92 119 76 116 61 106C76 96 92 93 106 99C100 85 102 69 110 52Z" fill="url(#beniGrad)"/>
            <circle cx="110" cy="106" r="6" fill="#140d11"/>
            <defs>
              <linearGradient id="beniGrad" x1="61" y1="52" x2="159" y2="160" gradientUnits="userSpaceOnUse">
                <stop stop-color="#fda4af"/>
                <stop offset="1" stop-color="#be123c"/>
              </linearGradient>
            </defs>
          </svg>
        </div>

        <div class="brand-foot">
          <span>Autentikasi Terenkripsi</span>
        </div>
      </aside>

      <!-- PANEL FORM: Kanan di Desktop, Sheet Utama di HP -->
      <div class="form-panel">
        <div class="form-container">
          <div class="form-header">
            <h1 id="form-title">Masuk ke Akun</h1>
          </div>

          <!-- Segmented Control Tabs -->
          <div id="tabs-container" class="tabs" role="tablist">
            <div class="tab-glider" aria-hidden="true"></div>
            <button type="button" id="tab-login" class="tab-btn active" role="tab" aria-selected="true">Masuk</button>
            <button type="button" id="tab-register" class="tab-btn" role="tab" aria-selected="false">Daftar</button>
          </div>

          <div id="alert-box" class="alert hidden" role="alert">
            <span class="alert-icon" aria-hidden="true"></span>
            <span id="alert-text"></span>
          </div>

          <!-- FORM MASUK -->
          <form id="login-form" class="auth-form" novalidate>
            <div class="form-group">
              <label for="login-email">Email</label>
              <div class="input-box">
                <span class="input-icon">
                  <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                    <rect width="20" height="16" x="2" y="4" rx="2"/>
                    <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
                  </svg>
                </span>
                <input type="email" id="login-email" placeholder="nama@domain.com" required autocomplete="email" />
              </div>
            </div>

            <div class="form-group">
              <label for="login-password">Kata Sandi</label>
              <div class="input-box">
                <span class="input-icon">
                  <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                    <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                  </svg>
                </span>
                <input type="password" id="login-password" placeholder="Masukkan kata sandi" required autocomplete="current-password" />
                <button type="button" class="toggle-pw" data-target="login-password" aria-label="Tampilkan sandi">
                  <svg class="eye-open" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                    <circle cx="12" cy="12" r="3"/>
                  </svg>
                  <svg class="eye-closed hidden" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/>
                    <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/>
                    <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/>
                    <line x1="2" x2="22" y1="2" y2="22"/>
                  </svg>
                </button>
              </div>
            </div>

            <button type="submit" id="btn-login" class="btn-primary">
              <span class="btn-text">Masuk</span>
              <span class="spinner hidden" aria-hidden="true"></span>
            </button>
          </form>

          <!-- FORM DAFTAR -->
          <form id="register-form" class="auth-form hidden" novalidate>
            <div class="form-group">
              <label for="reg-name">Nama Lengkap</label>
              <div class="input-box">
                <span class="input-icon">
                  <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
                    <circle cx="12" cy="7" r="4"/>
                  </svg>
                </span>
                <input type="text" id="reg-name" placeholder="Nama lengkap" required autocomplete="name" />
              </div>
            </div>

            <div class="form-group">
              <label for="reg-email">Email</label>
              <div class="input-box">
                <span class="input-icon">
                  <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                    <rect width="20" height="16" x="2" y="4" rx="2"/>
                    <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
                  </svg>
                </span>
                <input type="email" id="reg-email" placeholder="nama@domain.com" required autocomplete="email" />
              </div>
            </div>

            <div class="form-group">
              <label for="reg-password">Kata Sandi</label>
              <div class="input-box">
                <span class="input-icon">
                  <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                    <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                  </svg>
                </span>
                <input type="password" id="reg-password" placeholder="Minimal 6 karakter" minlength="6" required autocomplete="new-password" />
                <button type="button" class="toggle-pw" data-target="reg-password" aria-label="Tampilkan sandi">
                  <svg class="eye-open" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                    <circle cx="12" cy="12" r="3"/>
                  </svg>
                  <svg class="eye-closed hidden" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/>
                    <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/>
                    <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/>
                    <line x1="2" x2="22" y1="2" y2="22"/>
                  </svg>
                </button>
              </div>
              <div class="strength-bars" id="strength-meter" aria-hidden="true">
                <span class="s-bar"></span>
                <span class="s-bar"></span>
                <span class="s-bar"></span>
              </div>
            </div>

            <div class="form-group">
              <label for="reg-confirm">Konfirmasi Kata Sandi</label>
              <div class="input-box">
                <span class="input-icon">
                  <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                    <path d="m9 12 2 2 4-4"/>
                  </svg>
                </span>
                <input type="password" id="reg-confirm" placeholder="Ulangi kata sandi" minlength="6" required autocomplete="new-password" />
              </div>
            </div>

            <button type="submit" id="btn-register" class="btn-primary">
              <span class="btn-text">Buat Akun</span>
              <span class="spinner hidden" aria-hidden="true"></span>
            </button>
          </form>
        </div>
      </div>
    </section>
  </main>

  <script src="assets/js/script.js"></script>
</body>
</html>
