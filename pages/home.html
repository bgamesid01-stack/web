<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Workspace — SakuraPortal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/home.css" />
  <script src="../assets/js/guard.js"></script>
</head>
<body class="auth-checking">
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2.5c1.2 2.4 1.6 4.7.7 6.8 2.1-.8 4.5-.4 6.6 1.1-2 1.5-4.3 2-6.5 1.3 1.2 1.9 1 4.3-.4 6.5-1.4-2.2-1.6-4.6-.4-6.5-2.2.7-4.5.2-6.5-1.3 2.1-1.5 4.5-1.9 6.6-1.1-.9-2.1-.5-4.4.7-6.8z"/>
          </svg>
        </div>
        <span>SakuraPortal</span>
      </div>

      <div class="topbar-actions">
        <div class="user-pill">
          <div class="avatar" id="nav-avatar">U</div>
          <span id="nav-username">User</span>
        </div>
        <button type="button" id="btn-logout" class="btn-logout">Keluar</button>
      </div>
    </div>
  </header>

  <main class="workspace" id="workspace">
    <div class="page-head anim-up" style="--delay: 0.05s">
      <div>
        <h1>Halo, <span id="hero-name">Pengguna</span></h1>
      </div>
      <span class="status-tag">
        <span class="status-dot"></span>
        Sesi Aktif
      </span>
    </div>

    <section class="meta-grid">
      <article class="meta-card anim-up" style="--delay: 0.12s">
        <div class="meta-icon" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="20" height="16" x="2" y="4" rx="2"/>
            <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
          </svg>
        </div>
        <div>
          <span>Email Akun</span>
          <strong id="card-email">-</strong>
        </div>
      </article>

      <article class="meta-card anim-up" style="--delay: 0.18s">
        <div class="meta-icon" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
            <line x1="16" y1="2" x2="16" y2="6"/>
            <line x1="8" y1="2" x2="8" y2="6"/>
            <line x1="3" y1="10" x2="21" y2="10"/>
          </svg>
        </div>
        <div>
          <span>Tanggal Terdaftar</span>
          <strong id="card-date">-</strong>
        </div>
      </article>

      <article class="meta-card anim-up" style="--delay: 0.24s">
        <div class="meta-icon" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
        </div>
        <div>
          <span>Keamanan</span>
          <strong>SHA-256 Cloud Sync</strong>
        </div>
      </article>
    </section>

    <section class="content-surface anim-up" style="--delay: 0.3s">
      <div class="surface-header">
        <h2>Area Konten Utama</h2>
        <span class="surface-badge">Terproteksi</span>
      </div>
      <p>Halaman ini terkunci oleh sistem autentikasi. Silakan isi bagian ini dengan fitur atau konten utama aplikasi Anda.</p>
    </section>
  </main>

  <script src="../assets/js/home.js"></script>
</body>
</html>
