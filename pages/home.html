<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Beranda</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    body.auth-checking {
      visibility: hidden;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background: #fdf2f8;
      color: #2a1221;
      min-height: 100vh;
    }

    .navbar {
      background: #2b0d20;
      color: #ffffff;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(251, 207, 232, 0.14);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .nav-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 1.05rem;
    }

    .nav-logo {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      background: linear-gradient(135deg, #f472b6, #e11d74);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .user-chip {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.08);
      padding: 5px 12px 5px 6px;
      border-radius: 99px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .nav-avatar {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #e11d74;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.78rem;
      font-weight: 800;
    }

    .btn-logout {
      background: rgba(251, 113, 133, 0.16);
      color: #fda4af;
      border: 1px solid rgba(251, 113, 133, 0.3);
      padding: 7px 14px;
      border-radius: 10px;
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-logout:hover {
      background: #e11d74;
      color: #ffffff;
    }

    .container {
      max-width: 920px;
      margin: 28px auto;
      padding: 0 20px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .hero-banner {
      background:
        radial-gradient(circle at 88% 20%, rgba(244, 114, 182, 0.35), transparent 50%),
        linear-gradient(135deg, #2b0d20 0%, #58183c 60%, #9d174d 100%);
      color: #ffffff;
      border-radius: 22px;
      padding: 28px;
      box-shadow: 0 18px 36px -12px rgba(88, 24, 60, 0.3);
    }

    .hero-banner h1 {
      font-size: 1.6rem;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .hero-banner p {
      font-size: 0.9rem;
      color: rgba(255, 255, 255, 0.82);
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
    }

    .stat-card {
      background: #ffffff;
      border: 1px solid #f3d4e3;
      border-radius: 16px;
      padding: 18px 20px;
    }

    .stat-card span {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      color: #886377;
      margin-bottom: 4px;
    }

    .stat-card strong {
      font-size: 0.98rem;
      font-weight: 700;
      color: #2a1221;
      word-break: break-word;
    }
  </style>

  <script>
    const SESSION_KEY = "akunportal_active_user";
    const LOGIN_PAGE = "../index.html";
    let activeUser = null;

    try {
      const savedData = localStorage.getItem(SESSION_KEY);
      if (!savedData) throw new Error("Belum login");

      activeUser = JSON.parse(savedData);
      if (!activeUser || !activeUser.email) throw new Error("Sesi rusak");
    } catch {
      window.location.replace(LOGIN_PAGE);
    }
  </script>
</head>
<body class="auth-checking">
  <header class="navbar">
    <div class="nav-brand">
      <div class="nav-logo">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2c1.4 2.6 1.9 5.1.8 7.3 2.3-.9 4.9-.4 7.2 1.2-2.2 1.6-4.7 2.2-7.1 1.4 1.3 2.1 1.1 4.7-.4 7.1-1.5-2.4-1.7-5-.4-7.1-2.4.8-4.9.2-7.1-1.4 2.3-1.6 4.9-2.1 7.2-1.2-1.1-2.2-.6-4.7.8-7.3z"/>
        </svg>
      </div>
      <span>SakuraPortal</span>
    </div>

    <div class="nav-right">
      <div class="user-chip">
        <div class="nav-avatar" id="nav-avatar">U</div>
        <span id="nav-username">User</span>
      </div>
      <button type="button" class="btn-logout" onclick="logout()">Keluar</button>
    </div>
  </header>

  <main class="container">
    <section class="hero-banner">
      <h1>Halo, <span id="hero-name">Pengguna</span>!</h1>
      <p>Selamat datang di halaman utama.</p>
    </section>

    <section class="info-grid">
      <div class="stat-card">
        <span>Email</span>
        <strong id="card-email">-</strong>
      </div>
      <div class="stat-card">
        <span>Terdaftar</span>
        <strong id="card-date">-</strong>
      </div>
    </section>
  </main>

  <script>
    if (activeUser) {
      document.body.classList.remove("auth-checking");
      const initial = activeUser.name.charAt(0).toUpperCase();
      document.getElementById("nav-avatar").textContent = initial;
      document.getElementById("nav-username").textContent = activeUser.name;
      document.getElementById("hero-name").textContent = activeUser.name;
      document.getElementById("card-email").textContent = activeUser.email;
      document.getElementById("card-date").textContent = activeUser.createdAt || "-";
    }

    function logout() {
      localStorage.removeItem(SESSION_KEY);
      window.location.replace(LOGIN_PAGE);
    }
  </script>
</body>
</html>
